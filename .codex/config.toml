# Codex project config
#
# Instructions: Codex reads ../AGENTS.md from the repo root (canonical).
# MCP: keep these servers identical to ../.mcp.json — edit that JSON first,
# then mirror here (Codex needs TOML; keep in sync with ../.mcp.json).
# Skills: ../.agents/skills/ is canonical.

[mcp_servers.svelte]
command = "npx"
args = ["-y", "@sveltejs/mcp"]

[mcp_servers.gopls]
command = "sh"
args = ["-c", "cd gontroller && goroot=$(go env GOROOT) && cd .. && PATH=\"$goroot/bin:$PATH\" GOWORK=\"$PWD/gopls.work\" exec gopls mcp"]

[mcp_servers.design-patterns]
command = "sh"
args = [
  "-c",
  'AGENTS_TOOLS_DIR="${AGENTS_TOOLS_DIR:-$HOME/.agents}"; exec env DATABASE_PATH="$AGENTS_TOOLS_DIR/design_patterns_mcp/data/design-patterns.db" node "$AGENTS_TOOLS_DIR/design_patterns_mcp/dist/mcp-server.js"',
]
