# The server's config: the one in the image, and the template of yours — compose
# mounts ./config.yml over it (cp docker/config.yml config.yml). Paths are the
# container's: what compose.yml mounts. Every field: gontroller/config.example.yml.
mode: release

# The libraries on a disk, each mounted read only in compose.yml. None: providers
# only (paths: [])
paths:
  - /library
data_dir: /data   # database, caches: ./data

plugins:
  - /usr/lib/perceptrail/plugins/exif_geo.so
  - /usr/lib/perceptrail/plugins/ml_color.so

server:
  port: 1323

render:
  ffmpeg: /usr/lib/jellyfin-ffmpeg/ffmpeg
  # workers × threads: render's whole load (at nice 10). Default: from the CPUs this
  # container may use — an LXC shows the host's: set them there
  # workers: 2
  # threads: 3

# An Immich read through its API (read only); its key in a file of its own, never
# here — under ./data, or mounted beside the config
# providers:
#   immich:
#     url: http://immich.local:2283
#     api_key_file: /data/immich.key
