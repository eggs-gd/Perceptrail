name: CI

# Minimal checks: build, vet and tests. No artifacts, no releases.

on:
  push:
    branches: [ master, develop ]
  pull_request:
  workflow_dispatch:

jobs:

  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # scripts/version.sh counts commits

    - name: Version
      run: scripts/version.sh

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: gontroller/go.mod
        cache-dependency-path: '**/go.sum'

    # gopls (its MCP server) sees the repo through gopls.work: every Go module in it
    - name: gopls.work lists every Go module
      run: |
        diff <(git ls-files '*go.mod' | xargs -n1 dirname | sed 's|^|./|' | sort) \
             <(sed -n '/^use (/,/^)/p' gopls.work | grep -o '\./[^[:space:]]*' | sort)

    # AGENTS.md "Code Style": every file public first — in every Go module (gopls.work
    # lists them all, checked above), the checker's own included
    - name: declaration order
      run: |
        (cd scripts/declorder && go test ./... && go build -o "$RUNNER_TEMP/declorder" .)
        "$RUNNER_TEMP/declorder" $(sed -n '/^use (/,/^)/p' gopls.work | grep -o '\./[^[:space:]]*')

    - name: perceplib
      working-directory: perceplib
      run: |
        go vet ./...
        go test ./...

    # The import and render tests are integration tests: a real exiftool, a real
    # libvips (vipsthumbnail), a real ffmpeg
    - name: exiftool, libvips, ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl libvips-tools ffmpeg

    # -race: the import is a concurrent chain over a pool of exiftool processes (the
    # plugin tests build their .so with -race too)
    - name: gontroller
      working-directory: gontroller
      run: |
        go build -o /dev/null .
        go vet ./...
        go test -race ./...

    # Plugins must build against the same perceplib/zap versions as the host — and
    # load into it: -count=1, the test cache does not see the plugins change
    - name: perceptors
      run: |
        make build-plugins
        cd gontroller && go test -count=1 -run TestLoadExternalPlugins ./test/perceptor/

  svebapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svebapp
    env:
      # svebapp/.env is not committed; $env/static/public needs it at build time — the
      # API as the web container serves it
      PUBLIC_API_PATH: /api
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # vite.config.ts derives the version from history

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: svebapp/package-lock.json

    - run: npm ci
    - run: npm run check
    - run: npm run build

  # Every push to develop is one squash merge = one version. Tag it once checks pass.
  # master only receives fast-forwards of develop, so its commits are already tagged.
  tag:
    if: github.event_name == 'push'
    needs: [ go, svebapp ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Tag the version
      run: |
        v="v$(scripts/version.sh)"
        if tagged=$(git rev-parse -q --verify "refs/tags/$v^{commit}"); then
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$v already on $GITHUB_SHA"
            exit 0
          fi
          echo "::error::$v already points to $tagged, not $GITHUB_SHA"
          exit 1
        fi
        if [ "$GITHUB_REF_NAME" = "master" ]; then
          echo "::error::$GITHUB_SHA on master has no tag $v — release master only by fast-forwarding develop"
          exit 1
        fi
        git tag "$v" "$GITHUB_SHA"
        git push origin "$v"
        echo "tagged $v"
