# gontroller config. Copy to .var/config.yml for `make run`:
#   mkdir -p .var && cp config.example.yml .var/config.yml
# Or run with --config <file> (or GONTROLLER_CONFIG=<file>).
# Relative paths are resolved against the directory of this file.

# debug: SQL and every request logged, debug marks in the gallery (tile borders,
# console logging); release (the default): Info logs, a clean gallery
# mode: debug

# Library root: the photos to import
path: "/Users/me/Pictures/"

# External perceptors (`make build-plugins` from the repo root)
plugins:
  - ../.build/plugins/exif_geo.so

# Per perceptor (core: exif_date, exif_size, exif_duration; plugins by their name).
# Every perceptor is a view of the sheet (a button in the gallery). Not listed: it
# runs and is shown.
#   enabled: false  - not run at all (not shown either)
#   client: false   - runs, but the gallery gets no button for it
# perceptors:
#   exif_size:
#     client: false
#   exif_duration:
#     client: false

# Providers: libraries read through their own means, one after another in the
# import chain; what none of them claims is a plain folder. A provider not listed is
# enabled. apple: a *.photoslibrary under `path` — its DB, and PhotoKit on demand
# (macOS; access is asked once, the prompt names the terminal that started us).
# providers:
#   apple:
#     enabled: false   # not in the chain: the library is a plain folder then

# Database and caches (thumbnails). Default: the directory of this file
# data_dir: .

# Pause between the end of one scan's processing and the next scan. Default: 1m
# rescan: 1m

# ExifTool executable. Default: exiftool from PATH
# exiftool: /opt/exiftool/exiftool

server:
  host: ""      # all interfaces
  port: 1323
  # CORS: origins allowed to call the API. Default: any ("*")
  # allowed_origins:
  #   - http://localhost:5173

# Behind GORM (internal/model: sqlite.go, postgres.go)
database:
  driver: sqlite            # sqlite | postgres (not implemented yet)
  name: media_library.db    # sqlite: file, relative to data_dir; others: database name
  # Server drivers only (sqlite ignores them): username/password or token
  # host: localhost
  # port: 5432
  # username: user
  # password: password
  # token: ""
