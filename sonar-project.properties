# SonarQube on the owner's LAN server — a local analysis, no CI: `make sonar`.
# The host and the token come from the environment (SONAR_HOST_URL, SONAR_TOKEN; a
# git-ignored .env), never from here: the repository is public.
sonar.projectKey=perceptrail
sonar.projectName=Perceptrail
sonar.sourceEncoding=UTF-8

# The code: the Go modules and the gallery's TypeScript (Sonar does not read
# .svelte; svelte-check guards it). gontroller by its code only: the scanner walks
# a listed directory whole, and a dev checkout keeps its data there (.var: a cache
# of tens of thousands of files)
sonar.sources=gontroller/gontroller.go,gontroller/internal,perceplib,perceptors,scripts,svebapp/src
sonar.exclusions=svebapp/src/lib/workers/layout/dijkstra.js,**/*_test.go,**/*.test.ts,**/*.spec.ts,**/testdata/**,gontroller/test/**,**/node_modules/**,**/.build/**,**/.var/**,**/*.svelte

# The tests: next to their package, and gontroller's integration tests (test/)
sonar.tests=gontroller/internal,gontroller/test,perceplib,perceptors,scripts,svebapp/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.spec.ts,gontroller/test/**

# golangci-lint's findings (.golangci.yml), one report per module (make sonar)
sonar.go.golangci-lint.reportPaths=gontroller/golangci-lint.xml,perceplib/golangci-lint.xml,perceptors/exif_geo/golangci-lint.xml,perceptors/ml_color/golangci-lint.xml,perceptors/ml_faces/golangci-lint.xml,perceptors/ml_objects/golangci-lint.xml,scripts/declorder/golangci-lint.xml

# svebapp's unit tests' coverage (vitest, lcov: paths from the repo's root)
sonar.javascript.lcov.reportPaths=svebapp/coverage/lcov.info

# Go coverage: one profile per module (make sonar writes them)
sonar.go.coverage.reportPaths=gontroller/coverage.out,perceplib/coverage.out,perceptors/exif_geo/coverage.out,perceptors/ml_color/coverage.out,perceptors/ml_faces/coverage.out,perceptors/ml_objects/coverage.out,scripts/declorder/coverage.out

# Cognitive complexity is not a test's measure: a table of cases reads as one
sonar.issue.ignore.multicriteria=testComplexity,integrationComplexity
sonar.issue.ignore.multicriteria.testComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testComplexity.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.integrationComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.integrationComplexity.resourceKey=gontroller/test/**
