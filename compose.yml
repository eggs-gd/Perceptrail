# Perceptrail: the server and the web gallery. LIBRARY: your photos (mounted read
# only); the data stays in ./data. Then open http://<this host>:8080 (PORT changes it).
#
#   LIBRARY=/path/to/photos docker compose up -d
services:
  server:
    image: ghcr.io/eggs-gd/perceptrail-server:latest
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    volumes:
      - ${LIBRARY:?set LIBRARY to your photos' directory}:/library:ro
      - ./data:/data
    restart: unless-stopped

  web:
    image: ghcr.io/eggs-gd/perceptrail-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
